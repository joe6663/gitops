name : build and deploy
on:
  pull_request:
    types: 
      - opened
      - synchronize
    branches:
      - main
      - feature/pr_1
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    steps:
      - name: Build job intro
        run: |
          echo "Inside build job ${{github.event_name}}"
  deploy:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    steps:
      - name: deploy event
        run: |
          echo "inside deploy job"
