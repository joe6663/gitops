name : test_input
on : workflow_dispatch # input must be manual trigger
  inputs:
    env:
      description: env options
      default: dev
      type: choice
      options:
       - dev
       - test
       - prod
jobs:
  test_inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: echo_inputs
        run: |
         echo "env is ${{ inputs.env }}"
